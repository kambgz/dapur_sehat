<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dapur Sehat · Liquid Glass</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --em-500:#10b981;--em-600:#059669;--em-700:#047857;
    --slate-400:#94a3b8;--slate-500:#64748b;--slate-600:#475569;
    --slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;
    --amber-500:#f59e0b;--rose-500:#f43f5e;
    --glass-bg:linear-gradient(135deg,rgba(255,255,255,0.68),rgba(255,255,255,0.42));
    --glass-border:rgba(255,255,255,0.65);
    --glass-shadow:0 8px 32px rgba(15,23,42,0.08),inset 0 1px 0 rgba(255,255,255,0.9),inset 0 -1px 0 rgba(255,255,255,0.15);
    --blur:blur(28px) saturate(180%);
    --radius:18px;--radius-lg:24px;
  }
  html,body{min-height:100vh}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Inter",system-ui,sans-serif;
    color:var(--slate-800);line-height:1.5;-webkit-font-smoothing:antialiased;
    background:#eef2f7;position:relative;overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:-50%;z-index:-2;pointer-events:none;
    background:
      radial-gradient(circle at 15% 20%,rgba(255,175,189,0.55),transparent 42%),
      radial-gradient(circle at 85% 10%,rgba(147,197,253,0.55),transparent 42%),
      radial-gradient(circle at 10% 85%,rgba(167,243,208,0.55),transparent 42%),
      radial-gradient(circle at 92% 92%,rgba(196,181,253,0.5),transparent 42%),
      radial-gradient(circle at 50% 50%,rgba(254,240,138,0.35),transparent 55%);
    filter:blur(70px);
    animation:aurora 24s ease-in-out infinite alternate;
  }
  @keyframes aurora{
    0%{transform:translate(0,0) scale(1)}
    50%{transform:translate(2%,-1%) scale(1.05)}
    100%{transform:translate(-1%,2%) scale(1)}
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  .app{max-width:1100px;margin:0 auto;padding-bottom:40px}

  /* TOPBAR — floating glass pill */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;margin:14px 16px 0;border-radius:22px;
    position:sticky;top:12px;z-index:40;
    background:var(--glass-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-icon{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,#34d399,#059669);
    box-shadow:0 6px 16px rgba(16,185,129,0.4),inset 0 1px 0 rgba(255,255,255,0.4);
    position:relative;overflow:hidden;
  }
  .brand-icon::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,transparent 30%,rgba(255,255,255,0.5) 50%,transparent 70%);
    animation:shine 4s ease infinite;
  }
  @keyframes shine{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
  .brand h1{font-size:17px;font-weight:800;color:var(--slate-900);letter-spacing:-0.02em}
  .brand p{font-size:11px;color:var(--slate-500);font-weight:500}
  .top-actions{display:flex;gap:6px}
  .btn-icon{
    padding:9px 13px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:700;color:var(--slate-700);
    background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.8);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 2px 8px rgba(15,23,42,0.05);
    transition:all .2s;
  }
  .btn-icon:hover{background:rgba(255,255,255,0.8);transform:translateY(-1px)}
  .btn-icon:active{transform:translateY(0);background:rgba(255,255,255,0.9)}
  .btn-icon svg{width:15px;height:15px}

  /* NAV — segmented glass */
  .nav{
    display:flex;gap:4px;padding:6px;margin:10px 16px 0;
    background:rgba(255,255,255,0.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-border);border-radius:18px;box-shadow:var(--glass-shadow);
    position:sticky;top:82px;z-index:39;overflow-x:auto;scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none}
  .nav-btn{
    padding:9px 14px;border-radius:13px;font-size:13px;font-weight:600;color:var(--slate-500);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .25s cubic-bezier(.4,0,.2,1);
  }
  .nav-btn:hover{color:var(--slate-700)}
  .nav-btn.active{
    background:rgba(255,255,255,0.95);color:var(--em-700);
    box-shadow:0 2px 10px rgba(15,23,42,0.08),inset 0 1px 0 rgba(255,255,255,1);
  }
  .nav-btn svg{width:15px;height:15px}

  .content{padding:20px 16px}
  .card{
    background:var(--glass-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--glass-shadow);
  }
  .card-lg{padding:24px;border-radius:var(--radius-lg)}
  .section-title{font-size:18px;font-weight:800;color:var(--slate-900);letter-spacing:-0.02em;margin-bottom:4px}
  .section-sub{font-size:13px;color:var(--slate-500);margin-bottom:20px}

  /* HERO — liquid animated gradient */
  .hero{
    background:linear-gradient(135deg,#10b981,#059669,#0d9488,#059669,#10b981);
    background-size:300% 300%;animation:liquid 10s ease infinite;
    color:#fff;border-radius:var(--radius-lg);padding:26px;position:relative;overflow:hidden;
    box-shadow:0 20px 50px rgba(16,185,129,0.35),inset 0 1px 0 rgba(255,255,255,0.35),inset 0 -1px 0 rgba(0,0,0,0.1);
    border:1px solid rgba(255,255,255,0.25);
  }
  @keyframes liquid{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .hero::before{content:'';position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,0.2),transparent 70%);border-radius:50%}
  .hero::after{content:'';position:absolute;right:40px;bottom:-70px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,0.12),transparent 70%);border-radius:50%}
  .hero-label{font-size:11px;opacity:.9;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;position:relative;z-index:1}
  .hero-amount{font-size:42px;font-weight:900;letter-spacing:-0.04em;line-height:1;margin-bottom:6px;position:relative;z-index:1;text-shadow:0 2px 20px rgba(0,0,0,0.1)}
  .hero-sub{font-size:13.5px;opacity:.95;position:relative;z-index:1;font-weight:500}
  .hero-badge{
    display:inline-flex;align-items:center;gap:6px;margin-top:16px;
    background:rgba(255,255,255,0.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    padding:7px 13px;border-radius:20px;font-size:12px;font-weight:700;
    border:1px solid rgba(255,255,255,0.3);position:relative;z-index:1;
  }

  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat-card{
    background:var(--glass-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-border);border-radius:var(--radius);
    padding:16px;box-shadow:var(--glass-shadow);
  }
  .stat-label{font-size:10.5px;font-weight:700;color:var(--slate-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .stat-value{font-size:22px;font-weight:800;color:var(--slate-900);letter-spacing:-0.03em}
  .stat-value.small{font-size:16px}
  .stat-hint{font-size:11px;color:var(--slate-400);margin-top:4px}

  @media(max-width:640px){
    .stats-grid{grid-template-columns:repeat(2,1fr)}
    .hero-amount{font-size:32px}
    .brand p{display:none}
    .btn-icon span{display:none}
    .btn-icon{padding:9px}
    .nav{top:78px}
  }

  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filter-btn{
    padding:9px 15px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--slate-600);
    background:rgba(255,255,255,0.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 2px 8px rgba(15,23,42,0.04);
    white-space:nowrap;transition:all .2s;
  }
  .filter-btn:hover{background:rgba(255,255,255,0.75)}
  .filter-btn.active{
    background:linear-gradient(180deg,#10b981,#059669);color:#fff;border-color:transparent;
    box-shadow:0 4px 12px rgba(16,185,129,0.4),inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .search-box{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.8);border-radius:13px;padding:11px 15px;margin-bottom:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 2px 8px rgba(15,23,42,0.04);
  }
  .search-box svg{width:18px;height:18px;color:var(--slate-400);flex-shrink:0}
  .search-box input{border:none;outline:none;flex:1;font-size:14px;color:var(--slate-800);background:transparent;font-weight:500}

  .recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .recipe-card{
    background:var(--glass-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-border);border-radius:var(--radius);
    padding:16px;cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;gap:10px;box-shadow:var(--glass-shadow);
    position:relative;overflow:hidden;
  }
  .recipe-card::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg,transparent 40%,rgba(16,185,129,0.05) 100%);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .recipe-card:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(16,185,129,0.15),inset 0 1px 0 rgba(255,255,255,1)}
  .recipe-card:hover::before{opacity:1}
  .recipe-head{display:flex;justify-content:space-between;align-items:start;gap:8px}
  .recipe-name{font-size:14px;font-weight:700;color:var(--slate-900);line-height:1.35;letter-spacing:-0.01em}
  .badge-cat{
    font-size:9.5px;font-weight:800;padding:4px 8px;border-radius:7px;
    background:rgba(16,185,129,0.12);color:var(--em-700);
    white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;
    border:1px solid rgba(16,185,129,0.2);
  }
  .recipe-macros{display:flex;gap:14px;font-size:12px;color:var(--slate-500);font-weight:500}
  .recipe-macros strong{color:var(--slate-800);font-weight:800}
  .recipe-portion{font-size:11.5px;color:var(--slate-400);line-height:1.5}

  /* MODAL — heavy frosted backdrop */
  .modal-backdrop{
    position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    padding:16px;background:rgba(20,25,45,0.35);
    backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  .modal{
    background:linear-gradient(135deg,rgba(255,255,255,0.85),rgba(255,255,255,0.65));
    backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);
    border:1px solid rgba(255,255,255,0.85);
    border-radius:26px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;
    box-shadow:0 24px 60px rgba(15,23,42,0.25),inset 0 1px 0 rgba(255,255,255,1);
    animation:slideUp .35s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-head{
    padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.5);
    display:flex;justify-content:space-between;align-items:start;
    position:sticky;top:0;z-index:1;
    background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.7));
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-radius:26px 26px 0 0;
  }
  .modal-title{font-size:18px;font-weight:800;color:var(--slate-900);line-height:1.3;letter-spacing:-0.02em}
  .modal-body{padding:20px 24px 24px}
  .modal-close{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    color:var(--slate-500);background:rgba(15,23,42,0.06);
    backdrop-filter:blur(10px);flex-shrink:0;transition:all .2s;
  }
  .modal-close:hover{background:rgba(15,23,42,0.12);color:var(--slate-700)}
  .detail-section{margin-bottom:20px}.detail-section:last-child{margin-bottom:0}
  .detail-label{font-size:11px;font-weight:800;color:var(--slate-400);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
  .detail-macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .macro-box{
    background:rgba(255,255,255,0.6);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.7);border-radius:12px;padding:12px;text-align:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);
  }
  .macro-val{font-size:16px;font-weight:800;color:var(--slate-900);letter-spacing:-0.02em}
  .macro-lbl{font-size:10px;color:var(--slate-500);font-weight:700;text-transform:uppercase;margin-top:2px}
  .ingredient-list{display:flex;flex-direction:column;gap:6px}
  .ingredient-item{
    display:flex;justify-content:space-between;padding:10px 12px;
    background:rgba(255,255,255,0.5);border-radius:10px;font-size:13px;
    border:1px solid rgba(255,255,255,0.6);
  }
  .ingredient-item strong{color:var(--slate-800);font-weight:700}
  .ingredient-item span{color:var(--slate-500);font-weight:500}
  .steps-text{font-size:13px;color:var(--slate-600);line-height:1.75}

  .day-grid{display:flex;flex-direction:column;gap:10px}
  .day-card{
    background:var(--glass-bg);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border:1px solid var(--glass-border);border-radius:var(--radius);
    padding:16px;box-shadow:var(--glass-shadow);
  }
  .day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .day-name{font-size:14px;font-weight:800;color:var(--slate-900);letter-spacing:-0.01em}
  .day-badge{
    font-size:11px;font-weight:700;color:var(--slate-500);
    background:rgba(15,23,42,0.06);padding:4px 10px;border-radius:8px;
  }
  .meal-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.meal-slots{grid-template-columns:1fr}}
  .meal-slot{
    background:rgba(255,255,255,0.35);backdrop-filter:blur(10px);
    border:1.5px dashed rgba(255,255,255,0.7);border-radius:13px;
    padding:12px;display:flex;flex-direction:column;gap:6px;transition:all .25s;
  }
  .meal-slot.filled{
    border-style:solid;border-color:rgba(16,185,129,0.35);
    background:rgba(16,185,129,0.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .meal-slot.cooked{border-color:rgba(16,185,129,0.6);background:rgba(16,185,129,0.12)}
  .slot-label{font-size:10px;font-weight:800;color:var(--slate-500);text-transform:uppercase;letter-spacing:.08em}
  .slot-recipe{font-size:13px;font-weight:700;color:var(--slate-900);line-height:1.35}
  .slot-empty{font-size:13px;color:var(--slate-400);font-style:italic}
  .slot-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .slot-btn{
    padding:5px 9px;font-size:11px;font-weight:800;border-radius:8px;
    background:rgba(255,255,255,0.6);color:var(--slate-700);
    border:1px solid rgba(255,255,255,0.7);transition:all .15s;
  }
  .slot-btn:hover{background:rgba(255,255,255,0.9)}
  .slot-btn.primary{
    background:linear-gradient(180deg,#10b981,#059669);color:#fff;border-color:transparent;
    box-shadow:0 2px 6px rgba(16,185,129,0.35),inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .slot-btn.checked{background:linear-gradient(180deg,#10b981,#059669);color:#fff;border-color:transparent}
  .slot-btn.danger{background:rgba(244,63,94,0.12);color:#be123c;border-color:rgba(244,63,94,0.25)}

  .picker-list{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto;padding-right:4px}
  .picker-item{
    padding:12px;border-radius:12px;cursor:pointer;transition:all .2s;
    background:rgba(255,255,255,0.45);border:1px solid rgba(255,255,255,0.65);
  }
  .picker-item:hover{background:rgba(16,185,129,0.1);border-color:rgba(16,185,129,0.4)}
  .picker-item-name{font-size:13px;font-weight:700;color:var(--slate-800);margin-bottom:4px;letter-spacing:-0.01em}
  .picker-item-meta{font-size:11px;color:var(--slate-500);font-weight:500}

  .shopping-group{margin-bottom:20px}
  .shopping-group-head{
    display:flex;align-items:center;gap:8px;margin-bottom:10px;
    font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-500);
  }
  .shopping-group-head svg{width:16px;height:16px}
  .shopping-item{
    display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:6px;
    background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.7);border-radius:13px;
    cursor:pointer;transition:all .2s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 2px 8px rgba(15,23,42,0.03);
  }
  .shopping-item:hover{background:rgba(255,255,255,0.75);transform:translateY(-1px)}
  .shopping-check{
    width:22px;height:22px;border:2px solid var(--slate-300,#cbd5e1);border-radius:7px;
    display:grid;place-items:center;flex-shrink:0;transition:all .25s;
  }
  .shopping-item.checked .shopping-check{
    background:linear-gradient(180deg,#10b981,#059669);border-color:transparent;color:#fff;
    box-shadow:0 2px 6px rgba(16,185,129,0.4);
  }
  .shopping-item.checked .shopping-name{text-decoration:line-through;color:var(--slate-400)}
  .shopping-name{flex:1;font-size:14px;font-weight:600;color:var(--slate-800)}
  .shopping-qty{font-size:12px;color:var(--slate-500);font-weight:700}

  .savings-card{
    background:linear-gradient(135deg,#fbbf24,#f59e0b,#fbbf24);background-size:200% 200%;
    animation:liquid 8s ease infinite;color:#fff;border-radius:var(--radius-lg);
    padding:26px;margin-bottom:20px;position:relative;overflow:hidden;
    box-shadow:0 20px 50px rgba(245,158,11,0.35),inset 0 1px 0 rgba(255,255,255,0.35);
    border:1px solid rgba(255,255,255,0.25);
  }
  .savings-card::before{
    content:'';position:absolute;right:-30px;top:-30px;width:180px;height:180px;
    background:radial-gradient(circle,rgba(255,255,255,0.25),transparent 70%);border-radius:50%;
  }
  .savings-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;opacity:.95;margin-bottom:8px;position:relative;z-index:1}
  .savings-amount{font-size:44px;font-weight:900;letter-spacing:-0.04em;line-height:1;margin-bottom:8px;position:relative;z-index:1;text-shadow:0 2px 20px rgba(0,0,0,0.1)}
  .savings-desc{font-size:13px;opacity:.95;position:relative;z-index:1;font-weight:500}

  .log-list{display:flex;flex-direction:column;gap:8px}
  .log-item{
    display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
    background:rgba(255,255,255,0.55);backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.7);border-radius:13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 2px 8px rgba(15,23,42,0.03);
  }
  .log-info{flex:1}
  .log-name{font-size:13px;font-weight:700;color:var(--slate-800);letter-spacing:-0.01em}
  .log-date{font-size:11px;color:var(--slate-400);margin-top:2px;font-weight:500}

function updateDiffPreview(){
  const c=parseFloat(document.getElementById("inpCatering").value)||0;
  const k=parseFloat(document.getElementById("inpCook").value)||0;
  const diff=Math.max(0,c-k);
  document.getElementById("diffPreview").textContent=formatRupiah(diff);
  document.getElementById("diffMonthly").textContent="Setara "+formatRupiah(diff*60)+" per bulan (2 porsi/hari)";
}
function saveSettings(){
  const c=parseFloat(document.getElementById("inpCatering").value);
  const k=parseFloat(document.getElementById("inpCook").value);
  if(isNaN(c)||c<0||isNaN(k)||k<0){showToast("Masukkan angka yang valid (≥ 0)");return;}
  if(c<=k){showToast("Harga katering harus lebih besar dari biaya masak");return;}
  state.settings={cateringPrice:Math.round(c),cookCost:Math.round(k)};
  save();closeModal();showToast("Pengaturan biaya disimpan");render();
}
function resetSettings(){state.settings={...DEFAULT_SETTINGS};save();closeModal();showToast("Pengaturan direset ke default");render();}

function formatRupiah(n){return"Rp "+Math.round(n).toLocaleString("id-ID")}
function getRecipeById(id){return RECIPES.find(r=>r.id===id)}
function getPlannedRecipes(){
  const result=[];
  DAYS.forEach(day=>{MEALS.forEach(meal=>{
    const key=day+"-"+meal.id;const slot=state.plan[key];
    if(slot&&slot.recipeId){const recipe=getRecipeById(slot.recipeId);
      if(recipe)result.push({...recipe,day,meal:meal.id,slotKey:key,cooked:!!slot.cooked});}
  });});
  return result;
}
function getSavings(){return state.cooked.length*getSavingsPerMeal()}
function getWeekSavings(){return Object.values(state.plan).filter(s=>s.cooked).length*getSavingsPerMeal()}
function getShoppingList(){
  const planned=getPlannedRecipes();const map=new Map();
  planned.forEach(r=>{r.bahan.forEach(b=>{const key=b.nama+"_"+b.kat;
    if(!map.has(key))map.set(key,{nama:b.nama,kat:b.kat,qty:b.qty,count:0});
    map.get(key).count++;});});
  const grouped={};map.forEach(item=>{if(!grouped[item.kat])grouped[item.kat]=[];grouped[item.kat].push(item);});
  return grouped;
}

  const diff=now.getDate()-day+(day===0?-6:1);const monday=new Date(now.setDate(diff));

                <div class="slot-label">${m.label}</div>
                ${recipe?`
                  <div class="slot-recipe">${recipe.nama}</div>
                  <div style="font-size:11px;color:var(--slate-500);font-weight:600">${recipe.kalori} kkal · ${recipe.protein}g protein</div>
                  <div class="slot-actions">
                    <button class="slot-btn ${cooked?'checked':'primary'}" onclick="toggleCooked('${key}')">${cooked?'✓ Dimasak':'Tandai Masak'}</button>
                    <button class="slot-btn" onclick="openPicker('${key}')">Ganti</button>
                    <button class="slot-btn danger" onclick="removePlan('${key}')">×</button>
                  </div>`:`
                  <div class="slot-empty">Belum ada resep</div>
                  <button class="slot-btn primary" onclick="openPicker('${key}')" style="align-self:flex-start">+ Pilih Resep</button>`}
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`;
}
function toggleCooked(key){
  const slot=state.plan[key];if(!slot||!slot.recipeId)return;
  if(slot.cooked){slot.cooked=false;const idx=state.cooked.findIndex(c=>c.slotKey===key);if(idx>=0)state.cooked.splice(idx,1);}
  else{slot.cooked=true;state.cooked.push({slotKey:key,date:new Date().toISOString(),recipeId:slot.recipeId,day:key.split("-")[0],meal:key.split("-")[1],savedAmount:getSavingsPerMeal()});showToast("🎉 Hemat "+formatRupiah(getSavingsPerMeal())+" tercatat!");}
  save();render();
}
function markAllCooked(){
  let count=0;
  Object.keys(state.plan).forEach(key=>{const slot=state.plan[key];
    if(slot&&slot.recipeId&&!slot.cooked){slot.cooked=true;
      state.cooked.push({slotKey:key,date:new Date().toISOString(),recipeId:slot.recipeId,day:key.split("-")[0],meal:key.split("-")[1],savedAmount:getSavingsPerMeal()});count++;}});
  if(count>0){save();showToast("🎉 "+count+" porsi ditandai · Hemat "+formatRupiah(count*getSavingsPerMeal()));}
  render();
}
function resetWeek(){if(!confirm("Mulai minggu baru? Rencana direset, riwayat celengan tetap tersimpan."))return;
  state.plan={};state.shoppingChecked={};save();showToast("Minggu baru siap!");render();}
function removePlan(key){delete state.plan[key];const idx=state.cooked.findIndex(c=>c.slotKey===key);if(idx>=0)state.cooked.splice(idx,1);save();render();}
function addToPlanPrompt(recipeId){
  closeModal();const options=[];
  DAYS.forEach(day=>{MEALS.forEach(m=>{const key=day+"-"+m.id;
    if(!state.plan[key]||!state.plan[key].recipeId)options.push({key,label:day+" · "+m.label});});});
  if(options.length===0){showToast("Semua slot penuh!");return;}
  document.getElementById("modalRoot").innerHTML=`
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><div class="modal-title">Pilih Slot Jadwal</div>
          <button class="modal-close" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-body"><div class="picker-list">
          ${options.map(o=>`<div class="picker-item" onclick="assignPlan('${o.key}',${recipeId})"><div class="picker-item-name">${o.label}</div></div>`).join("")}
        </div></div>
      </div>
    </div>`;
}
function assignPlan(key,recipeId){state.plan[key]={recipeId,cooked:false};save();closeModal();showToast("Resep ditambahkan ke "+key.replace("-"," · "));render();}
function openPicker(key){
  document.getElementById("modalRoot").innerHTML=`
    <div class="modal-backdrop" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><div class="modal-title">Pilih Resep</div>
          <button class="modal-close" onclick="closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="modal-body">
          <div class="search-box" style="margin-bottom:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" placeholder="Cari resep..." oninput="filterPicker(this.value)" id="pickerSearch"></div>
          <div class="picker-list" id="pickerList">
            ${RECIPES.map(r=>`<div class="picker-item" onclick="assignPlan('${key}',${r.id})" data-name="${r.nama.toLowerCase()}">
              <div class="picker-item-name">${r.nama}</div>
              <div class="picker-item-meta">${r.kategori} · ${r.kalori} kkal · ${r.protein}g protein</div>
            </div>`).join("")}
          </div>
        </div>
      </div>
    </div>`;
}
function filterPicker(q){const query=q.toLowerCase();
  document.querySelectorAll("#pickerList .picker-item").forEach(item=>{item.style.display=item.dataset.name.includes(query)?"":"none";});}

function renderShopping(){
  const grouped=getShoppingList();const cats=Object.keys(grouped);
  const totalItems=cats.reduce((s,c)=>s+grouped[c].length,0);
  const checkedItems=Object.keys(state.shoppingChecked).filter(k=>state.shoppingChecked[k]).length;
  if(totalItems===0)return `
    <div class="view-header"><h2>Daftar Belanja Otomatis</h2><p>Berdasarkan rencana mingguan Anda</p></div>
    <div class="card"><div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      <p>Belum ada bahan untuk dibeli.<br>Rencanakan bekal minggu ini dulu.</p>
      <button class="btn btn-primary btn-sm mt-3" onclick="setView('plan')">Buka Rencana</button>
    </div></div>`;
  const icons={"Protein":'<path d="M6 3v12M18 3v12M6 9h12M6 21v-6h12v6"/>',"Karbo":'<path d="M12 2C8 2 4 6 4 10c0 4 3 8 8 12 5-4 8-8 8-12 0-4-4-8-8-8z"/>',"Sayur":'<path d="M11 20A7 7 0 019.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>',"Bumbu":'<circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/>'};
  return `
    <div class="view-header"><h2>Daftar Belanja Otomatis</h2><p>${totalItems} bahan · ${checkedItems} sudah dibeli · dari ${getPlannedRecipes().length} porsi</p></div>
    <div class="week-actions">
      <button class="btn btn-primary btn-sm" onclick="exportShopping()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Salin Daftar Belanja</button>
      <button class="btn btn-secondary btn-sm" onclick="clearShoppingChecks()">Reset Centang</button>
    </div>
    ${cats.map(cat=>`
      <div class="shopping-group">
        <div class="shopping-group-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icons[cat]||icons["Bumbu"]}</svg>${cat} · ${grouped[cat].length} item</div>
        ${grouped[cat].map(item=>{
          const key=item.nama+"_"+item.kat;const checked=state.shoppingChecked[key];
          const qty=item.count>1?item.count+"× "+item.qty:item.qty;
          return `<div class="shopping-item ${checked?'checked':''}" onclick="toggleShopping('${key.replace(/'/g,"\\'")}')">
            <div class="shopping-check">${checked?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>':''}</div>
            <div class="shopping-name">${item.nama}</div>
            <div class="shopping-qty">${qty}</div>
          </div>`;
        }).join("")}
      </div>`).join("")}`;
}
function toggleShopping(key){state.shoppingChecked[key]=!state.shoppingChecked[key];save();render();}
function clearShoppingChecks(){state.shoppingChecked={};save();render();showToast("Centang direset");}
function exportShopping(){
  const grouped=getShoppingList();
  let text="DAFTAR BELANJA - Dapur Sehat\n"+getCurrentWeekLabel()+"\n\n";
  Object.keys(grouped).forEach(cat=>{text+="=== "+cat+" ===\n";
    grouped[cat].forEach(item=>{const qty=item.count>1?item.count+"× "+item.qty:item.qty;
      text+="- "+item.nama+" ("+qty+")\n";});text+="\n";});
  navigator.clipboard.writeText(text).then(()=>showToast("Daftar belanja disalin!"))
    .catch(()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);showToast("Daftar belanja disalin!");});
}

function renderSavings(){
  const savings=getSavings();const meals=state.cooked.length;
  const savingsPerMeal=getSavingsPerMeal();
  const cateringPrice=getCateringPrice();const cookCost=getCookCost();
  const monthlyEstimate=savingsPerMeal*60;
  const sortedCooked=[...state.cooked].sort((a,b)=>new Date(b.date)-new Date(a.date));
  return `
    <div class="view-header"><h2>Celengan Katering</h2><p>Setiap porsi masak sendiri = hemat ${formatRupiah(savingsPerMeal)}</p></div>
    <div class="savings-card">
      <div class="savings-label">Total Tabungan</div>
      <div class="savings-amount">${formatRupiah(savings)}</div>
      <div class="savings-desc">Dari ${meals} porsi bekal yang sudah dimasak sendiri</div>
    </div>
    <div class="stats-grid mb-6">
      <div class="stat-card"><div class="stat-label">Porsi Dimasak</div><div class="stat-value">${meals}</div><div class="stat-hint">total sepanjang waktu</div></div>
      <div class="stat-card"><div class="stat-label">Proyeksi Bulanan</div><div class="stat-value small">${formatRupiah(monthlyEstimate)}</div><div class="stat-hint">2 porsi/hari × 30 hari</div></div>
      <div class="stat-card"><div class="stat-label">Setara Katering</div><div class="stat-value small">${formatRupiah(meals*cateringPrice)}</div><div class="stat-hint">nilai yang dihemat</div></div>
    </div>
    <div class="card mb-4" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:11px;font-weight:800;color:var(--slate-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Perhitungan Anda</div>
        <div style="font-size:13px;color:var(--slate-700);font-weight:500">
          Katering <strong>${formatRupiah(cateringPrice)}</strong> − Masak <strong>${formatRupiah(cookCost)}</strong>
          = <strong style="color:var(--em-700)">${formatRupiah(savingsPerMeal)}</strong> /porsi
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="showSettings()">⚙️ Ubah</button>
    </div>
    <div class="disclaimer mb-4">
      ⓘ Total hemat dihitung dari pengaturan biaya Anda. Angka default adalah estimasi pasar, bukan jaminan penghematan. Sesuaikan lewat tombol <strong>Atur</strong> agar sesuai pengeluaran aktual.
    </div>
    <div class="card">
      <div class="section-title" style="font-size:16px;margin-bottom:12px">Riwayat Masak</div>
      ${sortedCooked.length===0?`<div class="empty-state" style="padding:24px 0"><p>Belum ada riwayat. Tandai bekal yang sudah dimasak di halaman Rencana.</p>
        <button class="btn btn-primary btn-sm mt-3" onclick="setView('plan')">Buka Rencana</button></div>`:`
        <div class="log-list">${sortedCooked.slice(0,50).map(c=>{
          const r=getRecipeById(c.recipeId);const date=new Date(c.date);
          const dateStr=date.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
          const amt=c.savedAmount!=null?c.savedAmount:savingsPerMeal;
          return `<div class="log-item">
            <div class="log-info"><div class="log-name">${r?r.nama:"Resep tidak ditemukan"}</div>
            <div class="log-date">${c.day} · ${c.meal==='siang'?'Makan Siang':'Makan Malam'} · ${dateStr}</div></div>
            <div class="log-amount">+${formatRupiah(amt)}</div>
          </div>`;
        }).join("")}</div>`}
    </div>`;
}

function exportData(){
  const data={version:2,exportedAt:new Date().toISOString(),state:state};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="dapur-sehat-"+new Date().toISOString().slice(0,10)+".json";a.click();
  URL.revokeObjectURL(url);showToast("Data berhasil diexport");
}
function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{try{
    const data=JSON.parse(e.target.result);
    if(data.state){state={...state,...data.state,currentView:state.currentView,settings:{...DEFAULT_SETTINGS,...(data.state.settings||{})}};save();render();showToast("Data berhasil diimport");}
    else if(data.plan||data.cooked){state={...state,...data,currentView:state.currentView,settings:{...DEFAULT_SETTINGS,...(data.settings||{})}};save();render();showToast("Data berhasil diimport");}
    else alert("Format file tidak dikenali.");
  }catch(err){alert("Gagal import: "+err.message);}event.target.value="";};
  reader.readAsText(file);
}

function render(){
  renderNav();
  const view=document.getElementById("view");
  switch(state.currentView){
    case"dashboard":view.innerHTML=renderDashboard();break;
    case"recipes":view.innerHTML=renderRecipes();break;
    case"plan":view.innerHTML=renderPlan();break;
    case"shopping":view.innerHTML=renderShopping();break;
    case"savings":view.innerHTML=renderSavings();break;
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
load();render();
document.addEventListener("keydown",(e)=>{if(e.key==="Escape")document.getElementById("modalRoot").innerHTML="";});
</script>
</body>
</html>
